services:
  portal2:
    build: .
    container_name: portal2-local
    ports:
      - "5173:5173"
    volumes:
      - ./src:/app/src
      - ./public:/app/public
      - ./index.html:/app/index.html
      - ./vite.config.js:/app/vite.config.js
    environment:
      - CHOKIDAR_USEPOLLING=true
      - API_PROXY=http://server:3001
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173"]
    depends_on:
      - server

  server:
    build: ./server
    container_name: portal2-server
    ports:
      - "3001:3001"
    volumes:
      - ./server:/app
      - /app/node_modules
      - ./server/uploads:/app/uploads
    environment:
      - DATABASE_URL=postgresql://portal2:portal2@postgres:5432/portal2
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - CHAT_MODEL=claude-opus-4-7
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:pg16
    container_name: portal2-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=portal2
      - POSTGRES_PASSWORD=portal2
      - POSTGRES_DB=portal2
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portal2 -d portal2"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
