# it-hub stack — three services that boot together.
#
# Production: deployed alongside slicedesk's it-catalog on the same
# docker network. Slicedesk's nginx proxies /portal/* → it-hub-client,
# /portal/api/* → it-hub-server. See it-catalog's nginx.conf and
# docker-compose.yml for the outer routing.
#
# Local dev: run `docker compose up` from this directory. The frontend
# rebuilds on file changes (mount the source via the dev override
# below if you want the vite dev server instead — see commented block).

services:
  it-hub-client:
    build:
      context: .
      dockerfile: Dockerfile.client
      args:
        # Served behind slicedesk's nginx at /portal. (Use / for a standalone
        # origin-root deploy + tunnel.)
        VITE_BASE_PATH: ${VITE_BASE_PATH:-/portal/}
    container_name: it-hub-client
    # Exposed so a tunnel (cloudflared/ngrok) can reach the module for iframe
    # embedding. Not needed behind slicedesk's outer nginx.
    ports:
      - "${CLIENT_PORT:-8080}:80"
    depends_on:
      - it-hub-server

  it-hub-server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: it-hub-server
    # ports: ["3001:3001"]
    volumes:
      - it_hub_uploads:/app/uploads
      # Paired-module creds (apiKey / embedSecret / hub_url / moduleId) written
      # by the pairing step. Read by module-config.js; mounted read-only so the
      # secret isn't baked into the image.
      - ./server/.module-state.json:/app/.module-state.json:ro
    environment:
      - DATABASE_URL=postgresql://portal2:portal2@it-hub-postgres:5432/portal2
      - CHAT_MODEL=${CHAT_MODEL:-claude-sonnet-4-5}
      # Auth mode: 'dual' accepts the iframe hub_token when embedded AND the
      # slicedesk cookie when /portal is opened directly — so /portal keeps
      # working both ways. ('hub' = token only; 'slicedesk' = cookie only.)
      # HUB_URL / apiKey / embedSecret / moduleId come from the mounted state file.
      - AUTH_MODE=${AUTH_MODE:-dual}
      # Served behind slicedesk's nginx at /portal, so upload URLs need the prefix.
      - URL_PREFIX=${URL_PREFIX:-/portal}
      # Cookie fallback (dual/slicedesk): how this container reaches slicedesk's
      # /api/me + /api/ai/proxy on the mini's docker network.
      - SLICEDESK_API_URL=${SLICEDESK_API_URL:-http://it-catalog-server:3001}
      - SLICEDESK_LOGIN_URL=${SLICEDESK_LOGIN_URL:-/portal/login}
    depends_on:
      it-hub-postgres:
        condition: service_healthy

  # Headless render worker — monitors JS-only status pages (e.g. Adyen) that have
  # no feed/JSON/webhook. Reads `source='render'` targets from the DB, renders
  # each in headless Chromium on a slow cadence, and POSTs the result to the
  # hub's inbound webhook (internal URL). Optional: only needed if you use the
  # "Rendered page (JS)" source. Chromium lives here, not in it-hub-server.
  it-hub-render-worker:
    build:
      context: ./render-worker
      dockerfile: Dockerfile
    container_name: it-hub-render-worker
    environment:
      - DATABASE_URL=postgresql://portal2:portal2@it-hub-postgres:5432/portal2
      - HUB_INTERNAL_URL=http://it-hub-server:3001
      # How often to render each target (ms). Rendering is heavy → keep it slow.
      - RENDER_INTERVAL_MS=${RENDER_INTERVAL_MS:-300000}
      # Extra "all clear" phrases for vendors whose wording differs ('|'-separated).
      - RENDER_OK_PHRASES=${RENDER_OK_PHRASES:-}
    depends_on:
      it-hub-postgres:
        condition: service_healthy
      it-hub-server:
        condition: service_started
    restart: unless-stopped

  it-hub-postgres:
    image: pgvector/pgvector:pg16
    container_name: it-hub-postgres
    # ports: ["5433:5432"]   # uncomment if you want to psql from host
    environment:
      - POSTGRES_USER=portal2
      - POSTGRES_PASSWORD=portal2
      - POSTGRES_DB=portal2
    volumes:
      - it_hub_postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portal2 -d portal2"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  it_hub_postgres_data:
  it_hub_uploads:

# When deployed alongside it-catalog, both stacks share the default
# external network so slicedesk's nginx can reach `it-hub-client` and
# `it-hub-server` by container name. If running standalone, this stack
# uses its own default network.
