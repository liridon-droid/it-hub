# it-hub-client — internal nginx that serves the built Vite assets.
# Slicedesk's outer nginx already strips the /portal2/ prefix before
# forwarding here, so requests arrive looking like /admin.html,
# /assets/index.js, etc. Pure static — no API proxying.

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Long-lived caching for hashed assets — vite emits content-hashed
    # filenames so this is safe.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The static admin editor lives at /admin.html.
    location = /admin.html {
        try_files /admin.html =404;
    }

    # Everything else falls back to the React SPA's index.html so
    # client-side navigation works on direct deep links.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
