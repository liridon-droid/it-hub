# it-hub-client — nginx serving the built Vite assets.
#
# Two deployment shapes:
#  • Behind slicedesk's outer nginx (prod /portal/ mount): the outer nginx
#    strips the prefix and routes /portal/api/* and /portal/uploads/* straight
#    to the server container, so those never reach here — the proxies below
#    are simply unused on that path.
#  • Standalone module (paired + iframe-embedded via a tunnel): there is no
#    outer nginx, so THIS server must also reverse-proxy /api + /uploads to
#    it-hub-server. Build the client with VITE_BASE_PATH=/ so asset + API URLs
#    resolve at the origin root.

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # base64 image uploads become ~10 MB+ JSON envelopes; the server allows
    # 20 MB, so don't let nginx reject them first (nginx default is 1 MB).
    client_max_body_size 25m;

    # API + uploads → server. Used in standalone mode; harmless behind the
    # outer nginx (which routes those itself before they reach this container).
    location /api/ {
        proxy_pass http://it-hub-server:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /uploads/ {
        proxy_pass http://it-hub-server:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Long-lived caching for hashed assets — vite emits content-hashed names.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The SliceDesk Companion for Firefox: the signed .xpi and its update
    # manifest, from public/companion/. Firefox only shows the install prompt
    # when the file arrives as application/x-xpinstall; nginx's default mime
    # table has no entry for .xpi, so without this it would be a download.
    location /companion/ {
        types { application/x-xpinstall xpi; application/json json; text/markdown md; }
        default_type application/octet-stream;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=300";
    }

    # The static admin editor lives at /admin.html.
    location = /admin.html {
        try_files /admin.html =404;
    }

    # Everything else falls back to the SPA's index.html so deep links work.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
